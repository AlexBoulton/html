<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./page-signup.css" />
  </head>

  <body>
    
    <header class="hero">
      <div class="logo">
        <img src="images/Flower Logo.PNG" alt="Logo" />
      </div>
            
      <nav class="nav">
        <button class="button options-button" popovertarget="menu" style="anchor-name: --options-anchor">
          Options
          <svg viewBox="0 0 320 512" width="12" aria-hidden="true">
            <path
              d="M143 352.3L7 216.3c-9.4-9.4-9.4-24.6 0-33.9l22.6-22.6c9.4-9.4 24.6-9.4 33.9 0l96.4 96.4 96.4-96.4c9.4-9.4 24.6-9.4 33.9 0l22.6 22.6c9.4 9.4 9.4 24.6 0 33.9l-136 136c-9.2 9.4-24.4 9.4-33.8 0z"
            />
          </svg>       
        </button>

      <menu id="menu" class="items" popover>
        <li><a href="#plan-1">Boquets</a></li>
        <li><a href="#plan-2">Events</a></li>
        <li><a href="#plan-3">Pre Order</a></li>
      </menu>
      </nav>
   </header>

   <section class="signup">
    <form action="/action_page.php" style="border:1px solid #ccc">
  <div class="container">
    <h1>Sign Up</h1>
    <p>Please fill in this form to create an account.</p>
    <hr>

    <label for="email"><b>Email</b></label>
    <input type="text" placeholder="Enter Email" name="email" required>

    <label for="psw"><b>Password</b></label>
    <input type="password" placeholder="Enter Password" name="psw" required>

    <label for="psw-repeat"><b>Repeat Password</b></label>
    <input type="password" placeholder="Repeat Password" name="psw-repeat" required>
    
    <label>
      <input type="checkbox" checked="checked" name="remember" style="margin-bottom:15px"> Remember me
    </label>
    
    <p>By creating an account you agree to our <a href="#" style="color:dodgerblue">Terms & Privacy</a>.</p>

    <div class="clearfix">
      <button type="button" class="cancelbtn" onclick="document.getElementById('id02').style.display='block'; window.location.href='./index.html'">Cancel</button>
      <button type="button" class="modal-submit-btn" onclick="document.getElementById('id02').style.display='none'; document.getElementById('id04').style.display='block'">Sign Up</button>
    </div>
  </div>

  <div id="id04" class="modal">
  <div class="modal-content modal-content--narrow">
    <span onclick="document.getElementById('id04').style.display='none'" class="modal-close" title="Close Modal">&times;</span>
    <img src="images/tick.png" alt="Success" class="text-modal-image">
    <h2>Thank You for Signing Up!</h2>
    <p>An email will be sent shortly.</p>
    <div class="modal-actions">
      <button type="button" onclick="document.getElementById('id04').style.display='none'; window.location.href='./index.html'" class="modal-cancel-btn">Cancel</button>
    </div>
  </div>
</div>
</form>
   </section>
  </body>

  <script>
// Get the login and signupmodals
var loginModal = document.getElementById('id01');
var signupModal = document.getElementById('id02');
var suggestModal = document.getElementById('id03');
var textModal = document.getElementById('id04');

// When the user clicks anywhere outside of a modal, close it
window.onclick = function(event) {
    if (event.target == loginModal) {
        loginModal.style.display = "none";
    }
    if (event.target == signupModal) {
        signupModal.style.display = "none";
    }
    if (event.target == suggestModal) {
        suggestModal.style.display = "none";
    }
    if (event.target == textModal) {
        textModal.style.display = "none";
    }
}
  </script>
</html>
